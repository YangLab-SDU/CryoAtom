[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "CryoAtom2"
version = "2.1.1"
description = "CryoAtom2: automated atomic model building for cryo-EM density maps"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Baoquan Su", email = "202217127@mail.sdu.edu.cn" },
]
requires-python = ">=3.9,<3.10"
dependencies = [
    "numpy==1.21.5",
    "tqdm",
    "einops==0.6.0",
    "scipy==1.7.3",
    "biopython==1.81",
    "matplotlib==3.5.3",
    "mrcfile==1.4.3",
    "pandas==1.3.5",
    "fair-esm==2.0.0",
    "pyhmmer==0.7.1",
    "joblib==1.0.1",
    "ptflops==0.6.6",
    "scikit-learn==0.24.0",
    "threadpoolctl==2.2.0",
    "rna-fm==0.2.2",
    "openpyxl",
    # CUDA 11.8 builds, served from the PyTorch wheel index
    # (see [[tool.uv.index]] / [tool.uv.sources] below)
    "torch==2.1.0+cu118",
    "torchvision==0.16.0+cu118",
    "torchaudio==2.1.0+cu118",
]

[project.scripts]
cryoatom = "CryoAtom2.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["CryoAtom2*"]

[tool.setuptools.package-data]
"*" = ["./*.json", "./utils/*", "./utils/*.py", "./utils/*.txt", "./RUNet/*.py", "./CryoNet/*.py", "./checkpoint/*.pth"]

# PyTorch is installed from the PyTorch wheel index (CUDA 11.8 builds);
# everything else comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }